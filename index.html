<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>CashBack Marketing | Digital Marketing Agency</title>
    <meta name="title" content="CashBack Marketing | Digital Marketing Agency" />
    <meta name="description" content="CashBack Marketing is a digital marketing agency providing branding, web development, SEO, social media management, paid advertising, and creative marketing solutions." />

    <meta name="author" content="CashBack Marketing" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://cashback.marketing/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CashBack Marketing | Digital Marketing Agency" />
    <meta property="og:description" content="CashBack Marketing is a digital marketing agency providing branding, web development, SEO, social media management, paid advertising, and creative marketing solutions." />
    <meta property="og:url" content="https://cashback.marketing/" />
    <meta property="og:image" content="https://cashback.marketing/og-image.png" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CashBack Marketing | Digital Marketing Agency" />
    <meta name="twitter:description" content="CashBack Marketing is a digital marketing agency providing branding, web development, SEO, social media management, paid advertising, and creative marketing solutions." />
    <meta name="twitter:image" content="https://cashback.marketing/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo_cashback_color.png" />

    <!-- Fonts Preconnect & Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <!-- Structured Data (JSON-LD Organization Schema) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "CashBack Marketing",
        "url": "https://cashback.marketing/",
        "logo": "https://cashback.marketing/logo_cashback_color.png",
        "sameAs": [
          "https://www.instagram.com/cashback.marketingagency/",
          "https://www.facebook.com/profile.php?id=61587427587361",
          "https://www.tiktok.com/@cashback.9"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply saved theme before paint to avoid a flash
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
